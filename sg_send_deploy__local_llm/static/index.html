<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG Local LLM</title>
    <link rel="stylesheet" href="/static/core/sg-layout/v0.1.0/sg-layout.css">
    <link rel="stylesheet" href="/static/css/chat.css">
    <script src="/static/js/llm-api.js"></script>
    <script defer src="/static/components/session-list/session-list.js"></script>
    <script defer src="/static/components/chat-panel/chat-panel.js"></script>
    <script defer src="/static/components/model-picker/model-picker.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100vh; overflow: hidden; }
        #app       { height: 100vh; display: flex; flex-direction: column; }
        #header    { padding: 8px 16px; background: var(--color-surface);
                     border-bottom: 1px solid var(--color-border);
                     font-size: 15px; font-weight: 600; color: var(--color-text-muted); }
        #layout    { flex: 1; overflow: hidden; }
        sg-layout  { display: block; width: 100%; height: 100%;
                     --sgl-handle-size: 8px; }
    </style>
</head>
<body>
    <div id="app">
        <div id="header">SG Local LLM <span style="font-size:11px; opacity:0.5; margin-left:12px;">build ce52699</span></div>
        <div id="layout">
            <sg-layout id="main-layout"></sg-layout>
        </div>
    </div>
    <script type="module">
        import '/static/core/sg-layout/v0.1.0/sg-layout.js'

        await customElements.whenDefined('sg-layout')
        const layout = document.getElementById('main-layout')

        requestAnimationFrame(() => {
            layout.setAttribute('layout', JSON.stringify({
                type     : 'row',
                sizes    : [0.2, 0.8],
                children : [
                    { type : 'stack',
                      tabs : [{ type: 'tab', tag: 'session-list', title: 'Sessions', locked: true }],
                      activeTab: 0 },
                    { type : 'stack',
                      tabs : [{ type: 'tab', tag: 'chat-panel', title: 'New Chat' }],
                      activeTab: 0 }
                ]
            }))

            // Expose the chat stack ID so session-list can add tabs to it
            requestAnimationFrame(() => {
                const tree = layout.getLayout()
                if (tree && tree.children && tree.children[1]) {
                    window.__chatStackId = tree.children[1].id
                }
            })
        })
    </script>
</body>
</html>
