<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG Local LLM</title>
    <link rel="stylesheet" href="/static/core/sg-layout/v0.1.0/sg-layout.css">
    <link rel="stylesheet" href="/static/css/chat.css">
    <script src="/static/core/sg-layout/v0.1.0/sg-layout-events.js"></script>
    <script src="/static/core/sg-layout/v0.1.0/sg-layout.js"></script>
    <script src="/static/js/llm-api.js"></script>
    <script src="/static/components/session-list/session-list.js"></script>
    <script src="/static/components/chat-panel/chat-panel.js"></script>
    <script src="/static/components/model-picker/model-picker.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100vh; overflow: hidden; }
        #app       { height: 100vh; display: flex; flex-direction: column; }
        #header    { padding: 8px 16px; background: var(--color-surface);
                     border-bottom: 1px solid var(--color-border);
                     font-size: 15px; font-weight: 600; color: var(--color-text-muted); }
        #layout    { flex: 1; overflow: hidden; }
    </style>
</head>
<body>
    <div id="app">
        <div id="header">SG Local LLM</div>
        <div id="layout">
            <sg-layout layout='{"type":"row","children":[{"type":"stack","size":0.2,"children":[{"type":"tab","tag":"session-list","title":"Sessions"}]},{"type":"stack","size":0.8,"children":[{"type":"tab","tag":"chat-panel","title":"Chat"}]}]}'>
                <session-list></session-list>
                <chat-panel></chat-panel>
            </sg-layout>
        </div>
    </div>
</body>
</html>
