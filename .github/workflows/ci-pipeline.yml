name: CI Pipeline (Base)

on:
  workflow_call:
    inputs:
      git_branch:
        required: true
        type: string
      release_type:
        required: false
        type: string
        default: ""
      should_increment_tag:
        required: false
        type: boolean
        default: false
      target_deploy:
        required: true
        type: string
    secrets:
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_DEFAULT_REGION:
        required: false
      AWS_ACCOUNT_ID:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false

env:
  PACKAGE_NAME : 'sg_send_deploy'
  GIT__BRANCH  : ${{ inputs.git_branch }}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-unit-tests:
    name: "Run Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v

  increment-tag:
    name: Increment Tag
    runs-on: ubuntu-latest
    needs: [run-unit-tests]
    if: inputs.should_increment_tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increment Tag
        uses: ./.github/actions/git__increment-tag
        with:
          release_type: ${{ inputs.release_type }}

  deploy-docs:
    name: "Deploy Documentation"
    needs: [run-unit-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/configure-pages@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: sg_send_deploy__site

      - name: Build Jekyll site
        working-directory: sg_send_deploy__site
        run: bundle exec jekyll build --destination ../_site
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - uses: actions/deploy-pages@v4

  check-aws-credentials:
    name: Check AWS Credentials
    runs-on: ubuntu-latest
    needs: [run-unit-tests]
    outputs:
      has-credentials: ${{ steps.check.outputs.has-credentials }}
    steps:
      - name: Check if AWS credentials are configured
        id: check
        run: |
          if [[ -n "${{ secrets.AWS_ACCESS_KEY_ID }}"     ]] && \
             [[ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]] && \
             [[ -n "${{ secrets.AWS_DEFAULT_REGION }}"    ]] && \
             [[ -n "${{ secrets.AWS_ACCOUNT_ID }}"        ]]; then
            echo "has-credentials=true"  >> $GITHUB_OUTPUT
            echo "AWS credentials configured"
          else
            echo "has-credentials=false" >> $GITHUB_OUTPUT
            echo "AWS credentials not configured — deployment skipped"
          fi

  aws-deploy-lambda:
    if: needs.check-aws-credentials.outputs.has-credentials == 'true'
    name: Deploy Lambda
    runs-on: ubuntu-latest
    needs: [check-aws-credentials, increment-tag]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Lambda function
        uses: ./.github/actions/aws__deploy__lambda
        env:
          AWS_SECRET_ACCESS_KEY : ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION    : ${{ secrets.AWS_DEFAULT_REGION    }}
          AWS_ACCOUNT_ID        : ${{ secrets.AWS_ACCOUNT_ID        }}
          AWS_ACCESS_KEY_ID     : ${{ secrets.AWS_ACCESS_KEY_ID     }}
        with:
          target: ${{ inputs.target_deploy }}
