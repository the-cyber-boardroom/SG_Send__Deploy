name: CI Pipeline (Base)

on:
  workflow_call:
    inputs:
      git_branch:
        required: true
        type: string
      release_type:
        required: false
        type: string
        default: ""
      should_increment_tag:
        required: false
        type: boolean
        default: false

env:
  PACKAGE_NAME : 'sg_send_deploy'
  GIT__BRANCH  : ${{ inputs.git_branch }}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-unit-tests:
    name: "Run Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v

  increment-tag:
    name: Increment Tag
    runs-on: ubuntu-latest
    needs: [run-unit-tests]
    if: inputs.should_increment_tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increment Tag
        uses: ./.github/actions/git__increment-tag
        with:
          release_type: ${{ inputs.release_type }}

  deploy-docs:
    name: "Deploy Documentation"
    needs: [run-unit-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/configure-pages@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: sg_send_deploy__site

      - name: Build Jekyll site
        working-directory: sg_send_deploy__site
        run: bundle exec jekyll build --destination ../_site
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - uses: actions/deploy-pages@v4
