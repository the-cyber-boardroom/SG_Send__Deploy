name: "aws__deploy__lambda"
description: "Deploy the Lambda by running its pytest-based deploy tests"
inputs:
  target:
    description: "Target stage (dev, qa, prod)"
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install python dependencies
      shell: bash
      run: |
        pip install -r requirements-test.txt
        pip install -e .

    - name: Git Update Current Branch
      uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__update_branch@dev

    - name: Deploy Lambda function
      shell: bash
      run: |
        echo "Deploying to stage: ${{ inputs.target }}"
        pytest -rs ./tests/deploy/deploy_aws/test_Deploy__Service__to__${{ inputs.target }}.py
